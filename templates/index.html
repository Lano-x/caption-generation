<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频字幕生成系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>🎬 视频字幕生成系统</h1>
            <p class="subtitle">基于 Whisper + Ollama 的智能字幕生成</p>
        </header>

        <!-- 主要内容区 -->
        <main class="main-content">
            <!-- 上传区域 -->
            <section class="upload-section" id="uploadSection">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <h3>拖拽视频文件到此处</h3>
                    <p>或点击选择文件</p>
                    <p class="format-hint">支持格式: MP4, AVI, MKV, MOV, WMV, FLV, WebM</p>
                    <input type="file" id="fileInput" accept="video/*" hidden>
                </div>
            </section>

            <!-- 任务信息 -->
            <section class="task-section" id="taskSection" style="display: none;">
                <div class="task-info">
                    <h3>📄 文件信息</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="label">文件名:</span>
                            <span id="fileName">-</span>
                        </div>
                        <div class="info-item">
                            <span class="label">任务ID:</span>
                            <span id="taskId">-</span>
                        </div>
                        <div class="info-item">
                            <span class="label">状态:</span>
                            <span id="taskStatus" class="status-badge">-</span>
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="action-buttons">
                    <button class="btn btn-primary" id="processBtn" onclick="startProcessing()">
                        🚀 开始生成字幕
                    </button>
                    <button class="btn btn-secondary" id="uploadNewBtn" onclick="resetUpload()">
                        📁 上传新视频
                    </button>
                </div>
            </section>

            <!-- 进度区域 -->
            <section class="progress-section" id="progressSection" style="display: none;">
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                </div>
                <p class="progress-text" id="progressText">准备中...</p>
            </section>

            <!-- 字幕结果 -->
            <section class="result-section" id="resultSection" style="display: none;">
                <div class="result-header">
                    <h3>📝 字幕结果</h3>
                    <div class="result-actions">
                        <!-- 翻译选项 -->
                        <div class="translate-options">
                            <select id="sourceLang">
                                <option value="zh">中文</option>
                                <option value="en">英语</option>
                                <option value="ja">日语</option>
                                <option value="ko">韩语</option>
                            </select>
                            <span class="arrow">→</span>
                            <select id="targetLang">
                                <option value="en">英语</option>
                                <option value="zh">中文</option>
                                <option value="ja">日语</option>
                                <option value="ko">韩语</option>
                            </select>
                            <label class="checkbox-label">
                                <input type="checkbox" id="optimizeCheck" checked>
                                优化字幕
                            </label>
                            <button class="btn btn-small" onclick="translateSubtitles()">
                                🌐 翻译
                            </button>
                        </div>

                        <!-- 下载选项 -->
                        <div class="download-options">
                            <select id="downloadFormat">
                                <option value="srt">SRT 格式</option>
                                <option value="vtt">VTT 格式</option>
                                <option value="ass">ASS 格式</option>
                                <option value="txt">纯文本</option>
                            </select>
                            <button class="btn btn-small btn-success" onclick="downloadSubtitle()">
                                💾 下载字幕
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 字幕预览 -->
                <div class="subtitle-preview" id="subtitlePreview">
                    <table class="subtitle-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>时间</th>
                                <th>内容</th>
                            </tr>
                        </thead>
                        <tbody id="subtitleBody">
                            <!-- 字幕内容将在这里动态生成 -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 状态信息 -->
            <section class="status-section">
                <div class="status-cards">
                    <div class="status-card">
                        <h4>🤖 Whisper</h4>
                        <span id="whisperStatus">检查中...</span>
                    </div>
                    <div class="status-card">
                        <h4>🦙 Ollama</h4>
                        <span id="ollamaStatus">检查中...</span>
                    </div>
                    <div class="status-card">
                        <h4>🎮 GPU</h4>
                        <span id="gpuStatus">检查中...</span>
                    </div>
                </div>
            </section>
        </main>

        <!-- 页脚 -->
        <footer class="footer">
            <p>视频字幕生成系统 v1.0 | Powered by Whisper + Ollama</p>
        </footer>
    </div>

    <!-- 加载提示 -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-spinner"></div>
        <p id="loadingText">处理中...</p>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
